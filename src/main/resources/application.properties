spring.application.name=fitness-tracker
# Port: Render gibt den Port ueber die Umgebungsvariable PORT vor, lokal gilt 8080
server.port=${PORT:8080}
# Erlaubte Frontend-Ursprünge fuer CORS, kommagetrennt; lokal gilt der Vite-Port 5173
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
